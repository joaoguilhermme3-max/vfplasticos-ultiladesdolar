<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .txt-vf { font-family: 'Baloo 2', 'Arial Rounded MT Bold', sans-serif; font-weight: 800; }
      .txt-plasticos { font-family: 'Baloo 2', 'Arial Rounded MT Bold', sans-serif; font-weight: 700; }
      .txt-sub { font-family: Arial, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <rect width="720" height="360" fill="#FFFFFF"/>

  <!-- Símbolo de reciclagem -->
  <g transform="translate(100,80)">
    <circle cx="80" cy="80" r="78" fill="#FFFFFF" stroke="#1B9E4B" stroke-width="6"/>

    <!-- Seta 1 -->
    <g transform="rotate(0 80 80)">
      <path d="M80 30 L100 60 L88 60 L88 90 L72 90 L72 60 L60 60 Z" fill="#1B9E4B"/>
    </g>
    <!-- Seta 2 -->
    <g transform="rotate(120 80 80)">
      <path d="M80 30 L100 60 L88 60 L88 90 L72 90 L72 60 L60 60 Z" fill="#1B9E4B"/>
    </g>
    <!-- Seta 3 -->
    <g transform="rotate(240 80 80)">
      <path d="M80 30 L100 60 L88 60 L88 90 L72 90 L72 60 L60 60 Z" fill="#1B9E4B"/>
    </g>
  </g>

  <!-- Texto -->
  <g transform="translate(280,0)">
    <text x="0" y="150" class="txt-vf" font-size="90" fill="#E63946">VF</text>
    <text x="120" y="150" class="txt-plasticos" font-size="70" fill="#1A1A1A">Plásticos</text>
    <text x="0" y="190" class="txt-sub" font-size="26" fill="#1B4F91" letter-spacing="1">& UTILIDADES DO LAR</text>
  </g>
</svg>